name: Maintenance

# Whether GitHub's issue state agrees with `docs/roadmap/README.md` and the ADR index. That is
# bookkeeping about the PROJECT, not a property of the code a pull request changes, and it used to
# sit inside the required CI gate: a stale roadmap row turned `build` red on a branch that had not
# touched the roadmap, and the way through was to fix the table or wait.
#
# So it runs here instead -- manually, weekly, and on a change to the documents themselves. It
# still FAILS. Not blocking a merge and hiding a failure are different things, and the second one
# is what `continue-on-error` would be.
#
# What did NOT move: the Formula sha256 check, which stayed in `ci.yml` because a wrong hash is
# `brew install` failing for every user, and every observation, canon and locale guard, which are
# claims about what this repository ships.

on:
  workflow_dispatch:
  schedule:
    # Monday 03:00 UTC. Weekly because the thing being checked drifts when issues are closed, and
    # nobody closes issues faster than a week can notice. A tighter schedule would only convert a
    # quiet failure into a daily one.
    - cron: "0 3 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "docs/roadmap/**"
      - "docs/adr/**"
      - "Scripts/roadmap-table-matches-github.py"
      - "Scripts/adr-index-matches-github.py"
      - "Scripts/test-roadmap-table-guard.sh"
      - "Scripts/test-adr-index-guard.py"
      - ".github/workflows/maintenance.yml"

permissions:
  contents: read

concurrency:
  # Its own group. Sharing `ci.yml`'s would let a maintenance run cancel a code run on the same
  # ref, which is the opposite of separating them.
  group: maintenance-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The roadmap guard reads the table as the branch has it and the issues as GitHub has
          # them; the full history is here for the same reason it is in `ci.yml` -- a guard that
          # cannot see its base compares a file with itself.
          fetch-depth: 0

      - name: Self-test the roadmap drift guard (#678)
        # Offline, fixtures only. Asserts the guard fails on a stale row, on an open issue nobody
        # added, and on a row pointing at no issue — and that it refuses (exit 2) rather than
        # reporting clean on a truncated issue list or a table it could not parse.
        run: bash Scripts/test-roadmap-table-guard.sh

      - name: Self-test the ADR index guard (#815)
        # Offline, fixtures only, except its last case which runs the real guard against the real
        # tree — hence the token below rather than in this step.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/test-adr-index-guard.py

      - name: ADR index matches GitHub (#815)
        # On 2026-09-07 the index called eight ADRs `In Implementation` whose issues were CLOSED,
        # and nothing noticed, because the drift guard beside it had never been pointed at this
        # file. It reports CANNOT DETERMINE (exit 2) rather than passing when it cannot see.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/adr-index-matches-github.py

      - name: Roadmap table matches GitHub (#678)
        # `--pr` is passed only on a pull request, and only so the table may mark closed the issues
        # THAT pull request says it closes. Without it a PR closing an issue has no truthful row to
        # write: open while it is open, stale the instant it merges — which is what turned main red
        # on #684's own merge commit. On any other event no number is passed and nothing is exempt.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 Scripts/roadmap-table-matches-github.py \
            ${{ github.event.pull_request.number && format('--pr {0}', github.event.pull_request.number) || '' }}

      - name: Say what failed, in the run summary
        # A scheduled run nobody is watching needs its answer where it can be seen without opening
        # the log. This is `always()` on a REPORT, after the steps that decide -- it cannot turn a
        # failure into a pass, because the job's result is already set by the time it runs.
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Roadmap and ADR index agree with GitHub." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Maintenance failed"
              echo ""
              echo "The roadmap table or the ADR index disagrees with GitHub issue state, or a"
              echo "guard could not determine the answer. This does not block code merges; it is"
              echo "a real failure and the table is the thing to fix."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
