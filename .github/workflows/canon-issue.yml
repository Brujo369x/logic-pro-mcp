# An issue body states facts about Logic as often as a pull request does, and nothing read it.
#
# `docs/canon/README.md` said so plainly -- "the issue templates require it; nothing checks an
# issue mechanically yet" -- which made it an honest scope gap rather than a false claim, and
# Isaac's instruction named 이슈 등록 explicitly. This closes it.
#
# It COMMENTS rather than fails. An issue has no merge to block, and a red X on a bug report from
# an outside contributor is a way to lose the report. The comment names what is missing and links
# the document; a maintainer decides.
name: Canon citations in issues

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: canon-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  cite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: The issue body cites Logic, or says it states no fact about Logic
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json body -q .body > /tmp/issue.md
          # No file list: an issue changes nothing, so there is nothing to derive the opt-out from.
          # The check is therefore the weaker one -- references must resolve and be quoted -- and
          # an issue with no reference is reported rather than refused.
          if python3 Scripts/check-canon-citations.py --text /tmp/issue.md > /tmp/out.txt 2>&1; then
            cat /tmp/out.txt
            exit 0
          fi
          cat /tmp/out.txt
          {
            echo "This issue states something about Logic without citing Logic's own data, or"
            echo "cites it in a form that does not resolve. See \`docs/canon/README.md\`."
            echo
            echo '```'
            cat /tmp/out.txt
            echo '```'
            echo
            echo "Nothing is blocked -- an issue has no merge to stop. This is a note for whoever"
            echo "triages it."
          } > /tmp/comment.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
